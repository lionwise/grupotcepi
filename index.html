<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Entrada para Grupo WhatsApp</title>
  <style>
    /* Reset básico e responsividade */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 2rem 1rem;
    }
    .container {
      width: 100%;
      max-width: 480px;
      background: #fff;
      padding: 1.5rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      text-align: center;
    }

    /* Logo */
    #logo {
      display: block;
      margin: 0 auto 1.5rem;
      width: 60%;
      max-width: 200px;
      height: auto;
    }

    h1 {
      font-size: 1.4rem;
      margin-bottom: 1rem;
    }

    input, button {
      width: 100%;
      padding: 0.75rem;
      font-size: 1rem;
      margin-top: 0.5rem;
    }
    input {
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      background-color: #28a745;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color .2s ease;
    }
    button:hover {
      background-color: #218838;
    }

    .hidden {
      display: none;
    }
    #msg {
      color: red;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }

    #content p {
      margin-bottom: 0.75rem;
    }
    #content a {
      display: inline-block;
      color: #0069d9;
      text-decoration: none;
      margin-bottom: 1rem;
      word-break: break-all;
    }
    #content a:hover {
      text-decoration: underline;
    }
    #qr img {
      width: 100%;
      max-width: 280px;
      height: auto;
      margin-top: 1rem;
    }

    @media (min-width: 600px) {
      .container {
        padding: 2rem;
      }
      h1 {
        font-size: 1.6rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Logo da organização -->
    <img src="logo.png" alt="Logo TCE/PI News" id="logo">

    <h1>Digite o código de acesso</h1>

    <input type="password" id="codeInput" placeholder="Código de acesso">
    <button id="btnSubmit">Entrar</button>
    <p id="msg" class="hidden">Código inválido. Tente novamente.</p>

    <div id="content" class="hidden">
      <p>✔️ Código correto! Clique no link ou escaneie o QR code para entrar:</p>
      <a href="https://chat.whatsapp.com/SEU_LINK" target="_blank">Entrar no grupo</a>
      <div id="qr">
        <img id="qrCodeImg" alt="QR Code do grupo">
      </div>
    </div>
  </div>

  <script>
    // Defina seu código e link do grupo aqui
    const senha = 'SEU_CODIGO_AQUI';
    const grupoLink = 'https://chat.whatsapp.com/SEU_LINK';

    document.getElementById('btnSubmit').addEventListener('click', () => {
      const valor = document.getElementById('codeInput').value.trim();
      if (valor === senha) {
        document.getElementById('content').classList.remove('hidden');
        document.getElementById('msg').classList.add('hidden');
        document.getElementById('qrCodeImg').src =
          'https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=' +
          encodeURIComponent(grupoLink);
      } else {
        document.getElementById('msg').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
